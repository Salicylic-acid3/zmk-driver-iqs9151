# SPDX-License-Identifier: MIT

description: |
  Fuses one finger on each half of a split trackpad into a single gesture.
  Reference it from both listeners with param1 = 0 for the left pad and
  param1 = 1 for the right one; the two references share state. param2 carries
  flags for that reference (see dt-bindings/zmk/dual_pad.h): bit 0 inverts
  scroll, bit 1 inverts zoom, and bits 8..11 are the index into
  scroll-processors of the runtime scroll processor this chain uses, so the
  two-hand scroll follows the same runtime invert and speed as the one-pad
  scroll on that chain.

compatible: "zmk,input-processor-dual-pad"

include: ip_two_param.yaml

properties:
  touch-code:
    type: int
    default: 264
    description: Key code each half reports while its pad is being touched (264 = INPUT_BTN_8).

  scroll-start:
    type: int
    default: 30
    description: Shared movement, in device counts, before the gesture is treated as a scroll.

  zoom-start:
    type: int
    default: 60
    description: Separation between the two fingers, in device counts, before it is a zoom.

  scroll-divisor:
    type: int
    default: 16
    description: |
      Device counts per unit of scroll output. The pad's own counts: the
      pointer movement this processor receives has been through the cursor
      gain and the dynamic pointer scale, and both are divided out again (and
      the dynamic scroll scale applied) before this divisor, so that a finger
      on each pad scrolls at the same rate as two fingers on one pad going
      through the ordinary scroll chain with the same divisor.

  vertical-pad-axis:
    type: string
    default: "x"
    enum: ["x", "y"]
    description: |
      Which axis of the pad arrives here as vertical (INPUT_REL_Y) movement,
      so the right cursor gain is divided out: "x" when the listener swaps the
      axes before this processor (the pad's long axis is the screen's
      vertical), "y" when it does not.

  zoom-divisor:
    type: int
    default: 24
    description: Device counts of separation per unit of zoom output.

  invert-scroll:
    type: boolean
    description: Flip the scroll direction.

  invert-zoom:
    type: boolean
    description: Flip which way pinching in and out zooms.

  scroll-processors:
    type: phandles
    description: |
      The runtime scroll processors (zmk,input-processor-runtime) the
      listener chains put two-finger scroll through, one per chain that
      references this node with a different DUAL_PAD_SCROLL_PROC index. The
      processor named by the reference's index lends its axis invert and its
      scale to the two-hand scroll, which this processor emits after the
      chain's own scroll processing has already run. Without it the two-hand
      scroll ignores the app's scroll invert and speed.

  bindings:
    type: phandle-array
    description: |
      Behavior held down while zooming, so the host turns the wheel output
      into zoom - typically &kp LGUI on macOS or &kp LCTRL elsewhere.
