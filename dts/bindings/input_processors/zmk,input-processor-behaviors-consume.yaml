description: Input processor that invokes behaviors and neutralizes matched events

compatible: "zmk,input-processor-behaviors-consume"

include: ip_zero_param.yaml

properties:
  type:
    type: int
  codes:
    type: array
    required: true
  bindings:
    type: phandle-array
    required: true
  held-codes:
    type: array
    required: false
    description: |
      Codes from "codes" that are state events shared by every input device
      going through this processor, not gestures: the binding is pressed when
      the first device reports 1 and released when the last reports 0, and
      the event is passed on unchanged for processors further down the chain.
  held-skip-default-layer:
    type: boolean
    description: |
      A touch that begins with the default layer on top presses no held
      binding, whatever that layer has on the position. Held bindings also
      follow the top layer: leaving the layer releases them at once.
